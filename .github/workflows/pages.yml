name: Build and deploy Astro to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (use Node >=22.12.0 required by Astro)
        uses: actions/setup-node@v4
        with:
          # Use the 22.x line (will pick a version >= 22.12.0). Change to '24' if you prefer Node 24.
          node-version: "24.x"

      - name: Verify Node/npm versions
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Ensure .nojekyll in output
        run: |
          # default Astro output dir is ./dist — change if you set outputDir in astro.config.mjs
          if [ -d ./dist ]; then
            touch ./dist/.nojekyll
          else
            echo "ERROR: expected ./dist to exist. Check your astro build outputDir."
            ls -la
            exit 1
          fi

      - name: Upload Pages artifact
        # Use the newest pages upload action to avoid deprecated upload-artifact v3 dependency
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
